<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet the W35 IMC Team — USA Masters WC2026</title>
  <meta name="description" content="Meet the USA Women's O35 IMC Masters field hockey team at the 2026 WMH World Cup in Rotterdam, Netherlands — player cards for the whole squad.">
  <link rel="canonical" href="https://usamastersfh.com/team-w35imc">
  <!-- Social share card -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="USA Masters Fan Hub">
  <meta property="og:title" content="Meet the USA O35 IMC Women — 2026 World Cup">
  <meta property="og:description" content="The O35 IMC women's team, trading-card style. USA W35 IMC at the WMH World Cup, Rotterdam, July 22 – Aug 1.">
  <meta property="og:url" content="https://usamastersfh.com/team-w35imc">
  <meta property="og:image" content="https://usamastersfh.com/assets/og-team-w35imc.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Meet the USA O35 IMC Women — 2026 World Cup">
  <meta name="twitter:description" content="The O35 IMC women's team, trading-card style. USA W35 IMC at the WMH World Cup, Rotterdam, July 22 – Aug 1.">
  <meta name="twitter:image" content="https://usamastersfh.com/assets/og-team-w35imc.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/favicon.png" type="image/png">
</head>
<body>

  <!-- ============ NAV ============ -->
  <header class="nav nav-hub" id="top">
    <a class="nav-brand" href="./">
      <img id="navLogo" src="assets/logo.png" alt="USA Field Hockey Masters"
           onerror="this.style.display='none';document.getElementById('navFallback').style.display='flex'">
      <span id="navFallback" class="nav-fallback" style="display:none">
        <svg class="nav-mark" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="58" cy="13" r="10" fill="var(--navy)"/>
          <path d="M64 27 C74 40 66 55 54 64 C46 70 38 76 30 81" fill="none" stroke="var(--navy)" stroke-width="11" stroke-linecap="round"/>
          <path d="M60 32 C55 54 42 70 22 79 C16 82 10 82 7 79" fill="none" stroke="var(--red)" stroke-width="7" stroke-linecap="round"/>
          <circle cx="13" cy="90" r="5" fill="var(--navy)"/>
        </svg>
        <span class="lockup"><b class="lk-usa">USA</b><b class="lk-fh">Field Hockey</b></span>
        <span class="lk-bar"></span>
        <b class="lk-masters">MASTERS</b>
      </span>
    </a>
    <nav class="nav-links">
      <a href="july" id="schedLink">Schedule</a>
    </nav>
  </header>

  <!-- ============ HEADER ============ -->
  <main>
  <section class="section" id="roster">
    <div class="section-head">
      <h2 id="rosterTitle">Meet<br>the team<span style="color:var(--red)">.</span></h2>
      <p id="rosterSub"></p>
    </div>
    <div class="roster-grid" id="rosterGrid"></div>
    <p class="roster-note" id="rosterNote"></p>
  </section>
  </main>

  <footer class="footer">
    <p><b>GO USA! 🇺🇸🏑</b></p>
    <p>An unofficial fan hub made with love by a USA WO35 family. Always confirm times against official sources.</p>
    <p><a href="https://www.instagram.com/usamastersfh/">@usamastersfh</a></p>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/roster.js"></script>
  <script>
    (function () {
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const initials = (name) => name.split(/\s+/).filter(Boolean).map((w) => w[0]).join("").slice(0, 3).toUpperCase();

      // Which team? team.html?div=W40 etc. — defaults to WO35.
      const code = ROSTERS[new URLSearchParams(location.search).get("div")] ? new URLSearchParams(location.search).get("div") : "W35I";
      const team = ROSTERS[code];
      // players with headshots first; within each group keep roster order
      const players = [...team.players].sort((a, b) => (b.photo ? 1 : 0) - (a.photo ? 1 : 0));
      const total = players.length;

      document.title = `Meet the ${team.short} Team — USA Masters WC2026`;
      document.getElementById("rosterTitle").innerHTML = `Meet<br>the ${esc(team.short)}<span style="color:var(--red)">.</span>`;
      document.getElementById("rosterSub").textContent =
        `The USA ${team.label} squad taking the pitch at ${team.venue}, ${team.dates}. ` +
        (total ? "Tap any card to flip it over for the scouting report. 🇺🇸🏑" : "🇺🇸🏑");

      // Where this team's schedule lives: july (Schiedam/Rotterdam),
      // brasschaat (Belgium), breda (O65s) — all support ?div= deep links.
      const schedPage = team.inJuly ? "july" : (code === "M65" ? "breda" : "brasschaat");
      const sched = document.getElementById("schedLink");
      sched.textContent = `${team.short} Schedule`;
      sched.href = `${schedPage}?div=${code}#schedule`;

      const note = document.getElementById("rosterNote");
      if (total) {
        const staffLine = (team.staff || []).filter((s) => !s.photo).map((s) => `<b>${esc(s.role)}:</b> ${esc(s.name)}`).join(" · ");
        const altLine = team.alternates?.length ? `<b>Alternates:</b> ${team.alternates.map(esc).join(", ")}` : "";
        const extras = [staffLine, altLine].filter(Boolean).join("<br>");
        note.innerHTML = (extras ? `${extras}<br><br>` : "") +
          `📸 Player headshots &amp; favorite quotes are being collected — cards update as they come in.` +
          ` Catch every ${esc(team.short)} game on the <a href="${schedPage}?div=${code}#schedule">schedule</a>.`;
      } else {
        note.innerHTML = `🏑 The ${esc(team.short)} player cards are being put together — headshots, hometowns, colleges &amp; favorite quotes are on their way. Check back soon!`;
      }

      document.getElementById("rosterGrid").innerHTML = players.map((p) => {
        const jersey = p.number != null ? `#${esc(p.number)}` : "";
        const photoInner = p.photo
          ? `<img src="${esc(p.photo)}" alt="${esc(p.name)}" loading="lazy" decoding="async">`
          : `<div class="pc-initials">${esc(initials(p.name))}<small>Headshot coming soon</small></div>`;
        const photoClass = p.photo ? "pc-photo" : "pc-photo no-photo";
        const meta = [
          p.hometown ? `<span>📍 ${esc(p.hometown)}</span>` : "",
          p.college ? `<span>🎓 ${esc(p.college)}</span>` : "",
        ].join("");
        const quote = p.quote ? `<p class="pc-quote">“${esc(p.quote)}”</p>` : "";
        const fact = p.fact || "Scouting report coming soon — this one lets her stick do the talking.";
        return `
        <div class="pcard" role="button" tabindex="0" aria-label="${esc(p.name)} — tap to flip card">
          <div class="pcard-inner">
            <div class="pcard-face pcard-front">
              <div class="pc-strip"><span>USA · ${esc(team.short)}</span><span class="pc-no">${jersey}</span></div>
              <span class="pc-hint">Flip ↻</span>
              <div class="${photoClass}">${photoInner}</div>
              <h3 class="pc-name">${esc(p.name)}<i>.</i></h3>
              <p class="pc-pos">${esc([p.position, p.captain ? "Captain" : null].filter(Boolean).join(" · ") || "USA Masters")}</p>
              <div class="pc-meta">${meta}</div>
              ${quote}
            </div>
            <div class="pcard-face pcard-back">
              <span class="pc-back-kicker">Scouting Report</span>
              <h3 class="pc-back-name">${esc(p.name)}</h3>
              <div class="pc-back-bar"></div>
              <p class="pc-fact">${esc(fact)}</p>
              <div class="pc-back-foot"><span>${jersey}</span><span>usamastersfh.com</span></div>
            </div>
          </div>
        </div>`;
      }).join("");

      // Staff cards — team.staff entries that carry a photo render as
      // flip cards under their own heading; the rest stay in the note.
      const staffCards = (team.staff || []).filter((s) => s.photo);
      if (staffCards.length) {
        document.getElementById("rosterGrid").insertAdjacentHTML("afterend",
          `<h3 class="staff-head">Team Staff</h3><div class="roster-grid">` +
          staffCards.map((s) => `
        <div class="pcard" role="button" tabindex="0" aria-label="${esc(s.name)} — tap to flip card">
          <div class="pcard-inner">
            <div class="pcard-face pcard-front">
              <div class="pc-strip"><span>USA · ${esc(team.short)}</span><span class="pc-no"></span></div>
              <span class="pc-hint">Flip ↻</span>
              <div class="pc-photo"><img src="${esc(s.photo)}" alt="${esc(s.name)}" loading="lazy" decoding="async"></div>
              <h3 class="pc-name">${esc(s.name)}<i>.</i></h3>
              <p class="pc-pos">${esc(s.role)}</p>
              <div class="pc-meta">${s.hometown ? `<span>📍 ${esc(s.hometown)}</span>` : ""}</div>
            </div>
            <div class="pcard-face pcard-back">
              <span class="pc-back-kicker">Scouting Report</span>
              <h3 class="pc-back-name">${esc(s.name)}</h3>
              <div class="pc-back-bar"></div>
              <p class="pc-fact">${esc(s.fact || "Bio coming soon.")}</p>
              <div class="pc-back-foot"><span>${esc(s.role)}</span><span>usamastersfh.com</span></div>
            </div>
          </div>
        </div>`).join("") + `</div>`);
      }

      document.querySelectorAll(".pcard").forEach((card) => {
        // .anim keeps the 3D context (and back face) alive only for the
        // duration of the flip — cards at rest are cheap 2D layers
        const flip = () => {
          card.classList.add("anim");
          card.classList.toggle("flipped");
        };
        card.querySelector(".pcard-inner").addEventListener("transitionend", () => {
          if (!card.classList.contains("flipped")) card.classList.remove("anim");
        });
        card.addEventListener("click", flip);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
        });
      });
    })();
  </script>
</body>
</html>
